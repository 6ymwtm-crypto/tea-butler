<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>お茶執事</title>
<style>
  :root {
    --bg: #1c2420;
    --bg-panel: #232d27;
    --leaf: #4a6b52;
    --leaf-light: #6b8f72;
    --gold: #c8a86b;
    --cream: #ece6d6;
    --cream-dim: #b8b3a3;
    --user-bubble: #33403a;
    --line: #33403a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
  }

  header .mark {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
    display: inline-block;
    flex-shrink: 0;
    position: relative;
    top: -2px;
  }

  header h1 {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.05em;
    margin: 0;
    color: var(--cream);
  }

  header .sub {
    font-size: 11px;
    color: var(--cream-dim);
    letter-spacing: 0.05em;
  }

  #settingsBtn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--line);
    color: var(--cream-dim);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 20px;
    cursor: pointer;
  }

  #voiceBtn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--line);
    color: var(--cream-dim);
    font-size: 13px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #voiceBtn.on {
    border-color: var(--gold);
    color: var(--gold);
  }
  #settingsBtn { margin-left: 8px; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.agent { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 4px;
    line-height: 1.7;
    font-size: 15px;
    white-space: pre-wrap;
  }

  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--cream);
    border-radius: 14px 14px 3px 14px;
  }

  .row.agent .bubble {
    background: transparent;
    border-left: 2px solid var(--gold);
    padding-left: 13px;
    color: var(--cream);
    border-radius: 0;
  }

  .row.agent .label {
    display: block;
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 0 4px 15px;
    border-left: 2px solid var(--line);
  }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--cream-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  #empty {
    margin: auto;
    text-align: center;
    color: var(--cream-dim);
    font-size: 13px;
    line-height: 2;
    max-width: 260px;
  }
  #empty .leaf { font-size: 22px; margin-bottom: 10px; }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--bg-panel);
    flex-shrink: 0;
  }

  #q {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--cream);
    padding: 11px 14px;
    border-radius: 20px;
    font-size: 15px;
    outline: none;
  }
  #q:focus { border-color: var(--leaf-light); }

  #send {
    background: var(--leaf);
    color: var(--cream);
    border: none;
    padding: 0 20px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send:disabled { opacity: 0.4; }

  /* 設定モーダル */
  #modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  #modal.show { display: flex; }
  #modalBox {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
    width: 100%;
    max-width: 360px;
  }
  #modalBox h2 {
    font-size: 15px;
    margin: 0 0 6px;
    color: var(--gold);
  }
  #modalBox p {
    font-size: 12px;
    color: var(--cream-dim);
    line-height: 1.6;
    margin: 0 0 14px;
  }
  #modalBox input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--cream);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  #modalBox .btns { display: flex; gap: 8px; }
  #modalBox button {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    cursor: pointer;
  }
  #modalSave { background: var(--leaf); color: var(--cream); }
  #modalClear { background: transparent; border: 1px solid var(--line) !important; color: var(--cream-dim); }
</style>
</head>
<body>

<header>
  <span class="mark"></span>
  <div>
    <h1>お茶執事</h1>
    <div class="sub">TEA ADVISORY</div>
  </div>
  <button id="voiceBtn" title="読み上げ切替">🔊</button>
  <button id="settingsBtn">設定</button>
</header>

<div id="chat">
  <div id="empty">
    <div class="leaf">🍃</div>
    今日はどのようなご相談でしょう。<br>
    お菓子の名前や、今の気分をお聞かせください。
  </div>
</div>

<form id="form">
  <input id="q" type="text" placeholder="例：エッグタルトに合うお茶は？" autocomplete="off">
  <button id="send" type="submit">送信</button>
</form>

<div id="modal">
  <div id="modalBox">
    <h2>接続設定</h2>
    <p>GASでデプロイしたウェブアプリのURL（/execで終わるもの）を入力してください。この端末に保存され、次回以降は不要です。</p>
    <input id="urlInput" type="text" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="btns">
      <button id="modalClear" type="button">履歴を消去</button>
      <button id="modalSave" type="button">保存</button>
    </div>
  </div>
</div>

<script>
  const chatEl = document.getElementById('chat');
  const emptyEl = document.getElementById('empty');
  const form = document.getElementById('form');
  const qInput = document.getElementById('q');
  const sendBtn = document.getElementById('send');
  const modal = document.getElementById('modal');
  const urlInput = document.getElementById('urlInput');

  let GAS_URL = localStorage.getItem('teaButlerUrl') || '';
  let history = JSON.parse(localStorage.getItem('teaButlerHistory') || '[]');
  let voiceOn = localStorage.getItem('teaButlerVoiceOn') !== 'false'; // 既定でON

  const voiceBtn = document.getElementById('voiceBtn');
  function updateVoiceBtn() {
    voiceBtn.textContent = voiceOn ? '🔊' : '🔇';
    voiceBtn.classList.toggle('on', voiceOn);
  }
  updateVoiceBtn();
  voiceBtn.addEventListener('click', () => {
    voiceOn = !voiceOn;
    localStorage.setItem('teaButlerVoiceOn', voiceOn);
    updateVoiceBtn();
    if (!voiceOn) window.speechSynthesis.cancel();
  });

  let jpVoice = null;
  function pickVoice() {
    const voices = window.speechSynthesis.getVoices();
    jpVoice = voices.find(v => v.lang === 'ja-JP') || voices.find(v => v.lang && v.lang.startsWith('ja')) || null;
  }
  pickVoice();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }

  function speak(text) {
    if (!voiceOn) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    if (jpVoice) utter.voice = jpVoice;
    utter.rate = 1.0;
    utter.pitch = 0.9;
    window.speechSynthesis.speak(utter);
  }

  function renderHistory() {
    chatEl.innerHTML = '';
    if (history.length === 0) {
      chatEl.appendChild(emptyEl);
      return;
    }
    history.forEach(m => {
      if (m.role === 'user') addBubble(m.content, 'user');
      else if (m.role === 'assistant') addBubble(m.content, 'agent');
    });
    scrollBottom();
  }

  function addBubble(text, who) {
    const row = document.createElement('div');
    row.className = 'row ' + who;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (who === 'agent') {
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = 'お茶執事';
      bubble.appendChild(label);
      bubble.appendChild(document.createTextNode(text));
    } else {
      bubble.textContent = text;
    }
    row.appendChild(bubble);
    chatEl.appendChild(row);
  }

  function scrollBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row agent';
    row.id = 'typingRow';
    row.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    chatEl.appendChild(row);
    scrollBottom();
  }
  function hideTyping() {
    const el = document.getElementById('typingRow');
    if (el) el.remove();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = qInput.value.trim();
    if (!question) return;

    if (!GAS_URL) {
      openModal();
      return;
    }

    if (chatEl.contains(emptyEl)) emptyEl.remove();
    addBubble(question, 'user');
    scrollBottom();
    qInput.value = '';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ question, history, source: 'web' })
      });
      const data = await res.json();
      hideTyping();
      const answerText = data.answer || '申し訳ございません、応答が取得できませんでした。';
      addBubble(answerText, 'agent');
      speak(answerText);
      history = data.history || [...history,
        { role: 'user', content: question },
        { role: 'assistant', content: data.answer }
      ];
      localStorage.setItem('teaButlerHistory', JSON.stringify(history));
    } catch (err) {
      hideTyping();
      addBubble('通信中に問題が生じました。設定のURLをご確認ください。', 'agent');
    }
    sendBtn.disabled = false;
    scrollBottom();
  });

  function openModal() {
    urlInput.value = GAS_URL;
    modal.classList.add('show');
  }
  document.getElementById('settingsBtn').addEventListener('click', openModal);
  document.getElementById('modalSave').addEventListener('click', () => {
    GAS_URL = urlInput.value.trim();
    localStorage.setItem('teaButlerUrl', GAS_URL);
    modal.classList.remove('show');
  });
  document.getElementById('modalClear').addEventListener('click', () => {
    history = [];
    localStorage.removeItem('teaButlerHistory');
    renderHistory();
    modal.classList.remove('show');
  });
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });

  async function loadRemoteLog() {
    if (!GAS_URL) return;
    try {
      const res = await fetch(GAS_URL);
      const data = await res.json();
      if (data.log && data.log.length > 0) {
        const remoteHistory = data.log.flatMap(item => [
          { role: 'user', content: item.question },
          { role: 'assistant', content: item.answer }
        ]);
        history = remoteHistory;
        localStorage.setItem('teaButlerHistory', JSON.stringify(history));
      }
    } catch (err) {
      // 取得できなくても致命的ではないので、そのまま無視して既存の表示を使う
    }
  }

  (async () => {
    await loadRemoteLog();
    renderHistory();
    if (!GAS_URL) openModal();
  })();
</script>

</body>
</html>
